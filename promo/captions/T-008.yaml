bgm: Cat_life.mp3
bgm_start: 0.3
outro:
  above: "配信まであと3週"
# 4 本の下に A〜D の札（花の色を追いかけて付く。tools/promo_render.py の draw_tags）。答えの C は金色に
tags:
  from: 0.0
  to: 16.5
  items:
    - { text: A, colour: red }
    - { text: B, colour: yellow }
    - { text: C, colour: blue }
    - { text: D, colour: pink }
  emphasize: { text: C, from: 9.0 }
answer_stills: [9.6, 11.2, 12.8]
captions:
  - { from: 0.0,  to: 3.0,  text: "この中に1つだけ\nめったに咲かない色がある" }
  - { from: 3.0,  to: 6.0,  text: "左からA・B・C・D\nどれだと思う？" }
  - { from: 6.0,  to: 7.0,  text: "3" }
  - { from: 7.0,  to: 8.0,  text: "2" }
  - { from: 8.0,  to: 9.0,  text: "1" }
  - { from: 9.0,  to: 10.8, text: "正解はC\n青いチューリップ！" }
  - { from: 10.8, to: 12.5, text: "3%しか\n咲かない色" }
  - { from: 12.5, to: 14.3, text: "青は条件が\nそろうと咲くよ" }
  - { from: 14.3, to: 16.5, text: "当たった？\nコメントで教えて" }
