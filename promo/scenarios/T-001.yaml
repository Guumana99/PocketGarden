id: T-001
name: flower_garden          # 書き出すファイル名の後ろ（T-001_flower_garden.mp4）
title: 花の庭（荒れ地から完成まで）
fps: 30
seed: 42                     # 乱数を固定して、毎回同じ動きにする
hook_from_end: 0             # 最後の場面を頭に付けない
start:
  garden: new_game           # 新規ゲームの初期の庭（11×11 の荒れ地）
  season: spring_early
  time_of_day: morning
  weather: sunny
  ui: hidden
  tap_marker: true
camera: { zoom: fit }
timeline:
  - { at: 0.0,  day_label: "1日目" }
  - { at: 0.3,  till: { area: [2,2,8,8], over: 2.2 } }            # 中央の 7×7
  - { at: 2.6,  plant: { crops: [cosmos, tulip, snowdrop, sunflower], area: [2,2,8,8], over: 2.0,
                         colours: { tulip: [red, pink, yellow] } } }
    # 4 種類が混ざる並び（隣どうしは別の花）。ラベンダーは引きで暗い丸に見えるのでスノードロップに
  - { at: 4.7,  water: { area: [2,2,8,8], over: 1.6 } }
  - { at: 6.5,  day_label: "3日目" }
  - { at: 6.5,  grow: { area: [2,2,8,8], to_stage: 2, over: 1.2 } }
  # 寄りの中心は 2 匹の止まる点の真ん中の少し手前：左右対称で、庭の左右の切れが同じ
  - { at: 7.0,  camera: { zoom: 2.2, center: [7.5,7.5], over: 1.2 } }
  - { at: 8.0,  grow: { area: [2,2,8,8], to_stage: 3, over: 1.6 } }   # 寄った画面で咲く（音なし）
  # ちょうちょは画面の外（左右）の 7 マス先を出て（約 4.4 秒）、花畑を横切り、
  # 手前の端の花に交差して止まる。at は止まる秒
  - { at: 12.8, creature: { kind: butterfly, count: 1, from: outside_left,  from_distance: 7, land_on: [[8,5]], stay: 4.0 } }  # 右手前のスノードロップ
  - { at: 13.3, creature: { kind: butterfly, count: 1, from: outside_right, from_distance: 7, land_on: [[5,8]], stay: 4.0 } }  # 左手前のチューリップ
  # 左手前のチューリップに止まったちょうちょへ、ゲームで寄れる最大の倍率までゆっくり寄る
  # （center の 3 つ目は地面からの高さ（タイル幅）：止まっている点は花の上 0.6）
  - { at: 13.4, camera: { zoom: max, center: [5,8,0.6], over: 2.4 } }
  - { at: 16.3, end: true }
