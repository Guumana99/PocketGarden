# Store art (tools/store_art/README.md). Words, colours and which game screens are used live here,
# so that a season or an event can change them without touching the scripts.

font: tools/fonts/NotoSansJP.ttf

# Soft, natural-light colours: spring leaves, cream, a pale sky. Ink is the app's (GardenColors.Ink).
palette:
  ink: "#3E2723"
  ink_soft: "#6D4C41"
  sky_top: "#CFE6F2"
  sky_bottom: "#F7F1DF"
  leaf: "#9CC17A"
  leaf_dark: "#6F9A55"
  petal: "#F4C6CF"
  cream: "#FBF5E6"
  glow: "#FFF6D8"

# Game screens taken with capture.py (the real game, buttons and all).
captures:
  - { name: s01_spring_morning, garden: spring, season: SPRING, time: MORNING, scale: 0.37, cell: [5, 5], lift: 0 }
  - { name: s02_visitors, garden: spring, season: SPRING, time: MORNING, scale: 1.0, cell: [3.8, 1.6], lift: 370, butterfly: [5, 2], bird: struct_cottage, creatures: "butterfly,bird", record: { seconds: 28, pick: 10.0 } }
  - { name: s03_harvest, garden: spring, season: SPRING, time: DAY, scale: 0.85, cell: [4.5, 4.5], lift: 60, tap: [5, 4], press: [収穫, 閉じる], record: { seconds: 8, pick: 3.6 }, settle: 5 }
  - { name: s04_evening, garden: spring, season: SPRING, time: NIGHT, scale: 0.6, cell: [2.5, 3], lift: 160 }
  - { name: s05_book, garden: spring, season: SPRING, time: DAY, scale: 0.39, cell: [5, 5], open: ガーデン図鑑, then: [さくもつ] }
  - { name: s06_winter, garden: showcase, season: WINTER, weather: SNOWY, time: DAY, scale: 0.55, cell: [3, 6.5], lift: 40, extras: ["--ez", "snow_lying", "true"] }

feature:
  title: ポケット庭園
  tagline: 花を育てると、生き物が遊びに来る
  # The garden cut out of a promo recording (promo/scenarios/S-001.yaml, backdrop: none).
  garden: build/promo/S-001/frame_00065.png
  variants:
    A: { background: sky }
    B: { background: table }

screenshots:
  # Seasons drift across the six, spring to winter (tints over the same sky).
  tints: ["#F7F1DF", "#F3F2D9", "#F6ECD6", "#F4E6D8", "#EEE9E4", "#E9EEF2"]
  items:
    - { n: 1, capture: s01_spring_morning, title: "花を植えて、育てて、収穫" }
    - { n: 2, capture: s02_visitors, title: "花が咲くと、
生き物が遊びに来る" }
    - { n: 3, capture: s03_harvest, title: "くり返し実る作物も" }
    - { n: 4, capture: s04_evening, title: "朝・昼・夕方・夜、
庭の時間がめぐる" }
    - { n: 5, capture: s05_book, title: "図鑑を少しずつ埋めよう" }
    - { n: 6, capture: s06_winter, title: "自分らしく、庭を飾る" }
