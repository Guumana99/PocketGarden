  - { text: （ポケ庭）, size: 54 }
  # 配信が始まったら「Google Playで配信中」に差し替える
  - { text: Google Playで事前登録受付中, size: 64, pill: true }   # こげ茶の札にクリーム色の文字で目立たせる
  - { text: Android・年内配信予定, size: 44 }
blur: 18
