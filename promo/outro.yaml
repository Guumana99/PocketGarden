# 締めの画面（tools/promo_render.py）。文言はここだけで変える（全部の動画に効く）。
# 動画ごとに変えるときは字幕ファイルに outro:（ここと同じ書き方。書いた項目だけ置き換わる）
seconds: 1.5
title: ポケット庭園        # 大きく（画面の幅に収まる大きさに自動で縮める）
lines:                    # その下に、上から順に。size は文字の大きさ（px。字幕の安全な幅に収まらなければ自動で縮める）
  - { text: （ポケ庭）, size: 54 }
  # 配信が始まったら「Google Playで配信中」に差し替える
  # Play の検索にまだ出ないので「検索して」系は使わない。フォローして配信日を待ってもらう
  - { text: 12/19 配信スタート, size: 64, pill: true }   # こげ茶の札にクリーム色の文字で目立たせる
  - { text: Android・フォローで配信日にお知らせ, size: 44 }
# 動画ごとに札の上へ 1 行足すときは、字幕ファイルの outro: に above: "配信まであと3週" と書く（札の直前に入る）
blur: 18
