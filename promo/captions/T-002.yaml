bgm: Cat_life.mp3
bgm_start: 0.3
outro:
  title: つづく
  lines: [次回 ポケ庭日記 2日目, フォローで続きが届きます, ポケット庭園（ポケ庭）]
captions:
  - { from: 0.0,  to: 3.0,  text: "荒れ地の小さな庭を\nもらいました" }
  - { from: 3.0,  to: 5.5,  text: "目標は、ちょうちょが\n遊びに来る庭" }
  - { from: 5.5,  to: 10.0, text: "まずは小さな花壇に\nチューリップを植えます" }
  - { from: 10.0, to: 12.5, text: "植えたばかりの苗は\nお水たっぷり" }
  - { from: 12.5, to: 15.0, text: "咲いたら、誰か\n来てくれるかな" }
  - { from: 15.0, to: 19.0, text: "日が暮れてきて…" }
  - { from: 19.0, to: 21.5, text: "1日目はここまで" }
  - { from: 21.5, to: 24.5, text: "あなたなら、隣に何を植える？" }
