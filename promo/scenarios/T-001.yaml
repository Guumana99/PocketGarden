id: T-001
name: flower_garden          # 書き出すファイル名の後ろ（T-001_flower_garden.mp4）
title: 花の庭（荒れ地から完成まで）
fps: 30
seed: 42                     # 乱数を固定して、毎回同じ動きにする
hook_from_end: 0             # 最後の場面を頭に付けない
start:
  garden: new_game           # 新規ゲームの初期の庭（11×11 の荒れ地）
  season: spring_early
  time_of_day: morning
  weather: sunny
  ui: hidden
  tap_marker: true
camera: { zoom: fit }
timeline:
  - { at: 0.0,  day_label: "1日目" }
  - { at: 0.3,  till: { area: [2,2,8,8], over: 2.2 } }            # 中央の 7×7
  - { at: 2.6,  plant: { crops: [cosmos, tulip, lavender, sunflower], area: [2,2,8,8], over: 2.0,
                         colours: { tulip: [red, pink, yellow] } } }   # 4 種類が混ざる並び（隣どうしは別の花）
  - { at: 4.7,  water: { area: [2,2,8,8], over: 1.6 } }
  - { at: 6.5,  day_label: "3日目" }
  - { at: 6.5,  grow: { area: [2,2,8,8], to_stage: 2, over: 1.5 } }
  - { at: 8.2,  grow: { area: [2,2,8,8], to_stage: 3, over: 1.6 } }   # 咲く（音なし）
  - { at: 10.0, camera: { zoom: 2.2, center: [5.5,4.5], over: 1.2 } }
  # at は止まる秒。ちょうちょはその約 7 秒前に庭の外の空を出て、画面に入るのは 1〜2 秒前
  - { at: 11.5, creature: { kind: butterfly, count: 2, from: outside_left, land_on: [[6,5],[5,4]], stay: 3.0 } }   # コスモスとチューリップ
  - { at: 14.0, end: true }                                       # 2 匹目が止まって 2 秒
